[package]
name = "track-toolkit"
version = "0.1.0"
edition = "2021"
description = "One-click track build pipeline for NASCAR Racing 2003 Season / Papyrus Sandbox"
default-run = "track-toolkit"

[lib]
name = "ttk"
path = "src/lib.rs"

# GUI
[[bin]]
name = "track-toolkit"
path = "src/main.rs"

# Command-line front end (same pipeline, no window)
[[bin]]
name = "ttk"
path = "src/bin/ttk.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp"] }
eframe = "0.31"
rfd = "0.15"

[profile.release]
opt-level = 3
strip = true
